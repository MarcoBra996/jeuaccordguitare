<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Guitar Quest — Module accords acoustiques</title>
<style>
:root{--bg:#130b06;--wood:#7b421e;--wood2:#b66b2b;--cream:#fff4d7;--paper:#fffaf0;--ink:#25170f;--muted:#7b6a57;--gold:#ffc857;--green:#30b56b;--red:#e04b3f;--blue:#3b82f6;--violet:#8b5cf6;--shadow:0 24px 60px rgba(49,25,9,.22);--r:28px}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 20% 0%,#ffdb8a 0,#f3bf65 22%,transparent 42%),linear-gradient(135deg,#2b160b,#5b2f16 48%,#130b06);color:var(--ink)}button{font-family:inherit}.wrap{max-width:1180px;margin:auto;padding:20px}.shell{background:rgba(255,250,240,.94);border-radius:36px;box-shadow:var(--shadow);overflow:hidden;border:1px solid rgba(255,255,255,.35)}.top{display:flex;gap:16px;justify-content:space-between;align-items:center;padding:18px 22px;background:linear-gradient(90deg,#fff9e9,#ffe7b3)}.brand{display:flex;gap:14px;align-items:center}.logo{width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,#2a1509,#9b521f);display:grid;place-items:center;color:white;font-size:32px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}h1,h2,h3{margin:0;line-height:1.12}h1{font-size:clamp(24px,3vw,38px)}.sub{color:var(--muted);font-size:14px;margin-top:4px}.hud{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.chip{background:white;border:1px solid #f0d8a5;border-radius:999px;padding:10px 13px;font-weight:900;box-shadow:0 6px 16px rgba(0,0,0,.06)}.bar{width:220px;height:12px;background:#eed3a0;border-radius:999px;overflow:hidden;margin-top:8px}.bar>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--wood2),var(--gold));transition:.4s}.grid{display:grid;grid-template-columns:260px 1fr;gap:0}.nav{padding:16px;background:#fff2cf;border-right:1px solid #efd8aa}.nav button{width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:18px;margin:4px 0;font-weight:900;cursor:pointer;color:#3b2416}.nav button:hover{background:#fff}.nav button.on{background:#2b160b;color:white}.nav small{display:block;opacity:.65;font-weight:700;margin-top:2px}.stage{padding:24px;min-height:720px}.card{background:white;border-radius:var(--r);padding:24px;box-shadow:0 14px 32px rgba(93,52,18,.12);border:1px solid #f2dfb9;margin-bottom:18px}.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:22px;align-items:center}.scene{min-height:360px;border-radius:34px;background:linear-gradient(135deg,#2b160b,#8a4519);color:white;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden}.scene:before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;right:-210px;bottom:-230px;background:rgba(255,255,255,.07)}.guitar{font-size:92px;filter:drop-shadow(0 14px 20px rgba(0,0,0,.32));animation:float 2.4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-8px) rotate(-2deg)}}.btn{border:0;border-radius:18px;padding:13px 17px;font-weight:1000;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:8px}.btn:hover{transform:translateY(-1px);box-shadow:0 10px 18px rgba(0,0,0,.12)}.primary{background:var(--wood2);color:white}.dark{background:#2b160b;color:white}.soft{background:#f8e5bd;color:#2b160b}.blue{background:var(--blue);color:white}.green{background:var(--green);color:white}.danger{background:var(--red);color:white}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.pill{display:inline-block;background:#fff1c9;border:1px solid #edd09a;border-radius:999px;padding:8px 12px;margin:5px;font-weight:900}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.lesson{display:grid;grid-template-columns:.9fr 1.1fr;gap:18px}.note{background:#fff3d4;border:1px solid #efd39e;border-radius:22px;padding:16px}.ok{background:#e5faee;border-color:#a6e8bf}.ko{background:#ffe6e1;border-color:#ffb5aa}.info{background:#eaf2ff;border-color:#c8dbff}.diagram{background:#fff7e4;border:1px solid #ecd29d;border-radius:26px;padding:18px}.chordTitle{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.big{font-size:58px;font-weight:1000;color:#4b270f}.strings{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.str{background:white;border:2px solid #ead0a0;border-radius:18px;min-height:138px;text-align:center;padding:10px;position:relative;overflow:hidden}.str:before{content:"";position:absolute;left:50%;top:34px;width:4px;height:92px;transform:translateX(-50%);border-radius:999px;background:linear-gradient(#d1b180,#8b683a);opacity:.55}.sname{font-weight:1000;color:#4b270f;position:relative}.dot{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;margin:20px auto 8px;font-weight:1000;font-size:22px;position:relative;z-index:1;background:#fff0c2;border:2px solid #dda846}.open{background:#e4f8e8;border-color:#55b96c;color:#147333}.mute{background:#ffe0dc;border-color:#e16458;color:#b32118}.finger{position:relative;z-index:1;background:#2b160b;color:white;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:900;display:inline-block}.fretboard{background:#3a1f10;border-radius:22px;padding:18px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);color:white}.fb-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cell{height:58px;border:1px solid rgba(255,255,255,.2);border-radius:12px;display:grid;place-items:center;cursor:pointer;background:rgba(255,255,255,.06);font-weight:900}.cell.sel{background:var(--gold);color:#2b160b}.cell.good{background:var(--green);color:white}.cell.bad{background:var(--red);color:white}.quiz{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.opt{border:2px solid #e9cca0;border-radius:18px;background:white;padding:16px;text-align:left;font-weight:1000;cursor:pointer}.opt:hover{background:#fff2d3}.opt.good{background:#e5faee;border-color:var(--green)}.opt.bad{background:#ffe6e1;border-color:var(--red)}.feedback{display:none;margin-top:14px;padding:14px;border-radius:18px;font-weight:900}.feedback.show{display:block}.meter{height:18px;background:#ead2a3;border-radius:999px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--gold));transition:.25s}.drum{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:14px}.beat{height:70px;border-radius:16px;border:2px solid #e5c792;background:white;display:grid;place-items:center;font-size:26px;font-weight:1000;cursor:pointer}.beat.on{background:#2b160b;color:white}.beat.hit{animation:pulse .28s}@keyframes pulse{50%{transform:scale(1.07);background:var(--gold)}}.result{font-size:72px;font-weight:1000;color:#4b270f}.hidden{display:none!important}@media(max-width:900px){.grid,.hero,.lesson,.two{grid-template-columns:1fr}.nav{border-right:0;border-bottom:1px solid #efd8aa}.strings{grid-template-columns:repeat(3,1fr)}.quiz{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.bar{width:100%}}
</style>
</head><body><div class="wrap"><div class="shell"><header class="top"><div class="brand"><div class="logo">🎸</div><div><h1>Guitar Quest — Accords acoustiques</h1><div class="sub">Un vrai mini-module Rise : 4–5 minutes, interactions, audio, feedback et challenge.</div><div class="bar"><i id="progress"></i></div></div></div><div class="hud"><div class="chip">XP <span id="xp">0</span></div><div class="chip">Étape <span id="step">1</span>/8</div><div class="chip">⭐ <span id="stars">0</span></div></div></header><div class="grid"><nav id="nav" class="nav"></nav><main id="stage" class="stage"></main></div></div></div>
<script>
const chords=[{id:'C',name:'Do majeur',fam:'majeur',mood:'clair et stable',notes:['C4','E4','G4','C5'],d:['x','3','2','0','1','0'],f:['','3','2','','1',''],tip:'Ne gratte pas la corde E grave. Arrondis les doigts pour laisser sonner G.'},{id:'G',name:'Sol majeur',fam:'majeur',mood:'ample et ouvert',notes:['G3','B3','D4','G4','B4'],d:['3','2','0','0','0','3'],f:['3','2','','','','4'],tip:'Les cordes à vide doivent rester claires. Détends la main.'},{id:'D',name:'Ré majeur',fam:'majeur',mood:'brillant et précis',notes:['D4','F#4','A4','D5'],d:['x','x','0','2','3','2'],f:['','','','1','3','2'],tip:'Ne joue pas E grave ni A. Vise les quatre cordes aiguës.'},{id:'Em',name:'Mi mineur',fam:'mineur',mood:'sombre et facile',notes:['E3','G3','B3','E4','G4'],d:['0','2','2','0','0','0'],f:['','2','3','','',''],tip:'Seulement deux doigts, toutes les cordes peuvent sonner.'},{id:'Am',name:'La mineur',fam:'mineur',mood:'doux et mélancolique',notes:['A3','C4','E4','A4','C5'],d:['x','0','2','2','1','0'],f:['','','2','3','1',''],tip:'Ne joue pas E grave. Compare la forme avec C.'},{id:'E',name:'Mi majeur',fam:'majeur',mood:'plein et puissant',notes:['E3','G#3','B3','E4','G#4'],d:['0','2','2','1','0','0'],f:['','2','3','1','',''],tip:'Comme Em, mais avec le doigt 1 sur G case 1.'}];
const strings=['E','A','D','G','B','e'], full=['E grave','A','D','G','B','e aiguë'];
const screens=[['home','Briefing','Objectifs'],['read','Lire un diagramme','X, 0, doigts'],['lab','Chord Lab','Manipuler'],['coach','Coach rythmique','Strumming'],['memory','Memory accords','Associer'],['ear','Oreille musicale','Écouter'],['song','Mini-morceau','Progression'],['boss','Boss final','Validation']];
let screen='home',xp=0,stars=0,done=new Set(),labChord=chords[0],selected=[],memoryCards=[],openCards=[],matched=0,earChord=null,boss={i:0,score:0,qs:[]};
const $=id=>document.getElementById(id), rnd=a=>a[Math.floor(Math.random()*a.length)], sh=a=>[...a].sort(()=>Math.random()-.5);
function award(n){xp+=n;if(xp>=120&&stars<1)stars=1;if(xp>=260&&stars<2)stars=2;if(xp>=420&&stars<3)stars=3;hud()}function complete(id){done.add(id);hud();nav()}function hud(){ $('xp').textContent=xp; $('stars').textContent=stars; $('step').textContent=screens.findIndex(s=>s[0]==screen)+1; $('progress').style.width=Math.round(done.size/screens.length*100)+'%'}
function nav(){let n=$('nav');n.innerHTML=screens.map(s=>`<button class="${screen==s[0]?'on':''}" onclick="go('${s[0]}')">${done.has(s[0])?'✓ ':''}${s[1]}<small>${s[2]}</small></button>`).join('')}function go(id){screen=id;render();scrollTo({top:0,behavior:'smooth'})}
function diagram(c){return `<div class="diagram"><div class="chordTitle"><div><div class="big">${c.id}</div><b>${c.name}</b> · ${c.fam}</div><button class="btn soft" onclick="play('${c.id}',true)">🎧 écouter</button></div><div class="strings">${c.d.map((v,i)=>`<div class="str"><div class="sname">${strings[i]}</div><div class="dot ${v=='0'?'open':''} ${v=='x'?'mute':''}">${v.toUpperCase()}</div>${c.f[i]?`<span class="finger">doigt ${c.f[i]}</span>`:''}</div>`).join('')}</div></div>`}
function render(){nav();hud(); if(screen=='home')home(); if(screen=='read')read(); if(screen=='lab')lab(); if(screen=='coach')coach(); if(screen=='memory')memory(); if(screen=='ear')ear(); if(screen=='song')song(); if(screen=='boss')bossStart()}
function home(){stage.innerHTML=`<section class="card hero"><div><span class="pill">Durée cible : 4–5 min</span><h2>Mission : jouer tes premiers accords</h2><p>Tu vas apprendre <b>C, G, D, Em, Am, E</b> avec des activités variées : lecture, manipulation, rythme, memory, écoute, mini-morceau et challenge final.</p><div class="two"><div class="note ok"><b>Objectif pratique</b><br>Savoir où placer les doigts et quelles cordes éviter.</div><div class="note info"><b>Objectif musical</b><br>Entendre la différence entre majeur et mineur.</div></div><div class="actions"><button class="btn primary" onclick="award(20);complete('home');go('read')">🚀 Commencer</button><button class="btn soft" onclick="progression()">🎵 Exemple sonore</button></div></div><div class="scene"><div><div class="guitar">🎸</div><h2>Guitar Quest</h2><p>Apprendre par l’action, pas par un quiz plat.</p></div></div></section>`}
function read(){stage.innerHTML=`<section class="card"><h2>1. Lire un diagramme</h2><p>Un diagramme te dit quoi jouer : <b>X</b> = corde muette, <b>0</b> = corde à vide, les chiffres ronds indiquent les cases et les doigts.</p><div class="lesson"><div>${diagram(chords[0])}</div><div class="note"><h3>Micro-défi</h3><p>Sur C, clique sur la signification de X.</p><div class="quiz"><button class="opt" onclick="q(this,false)">Corde à jouer fort</button><button class="opt" onclick="q(this,true)">Corde à ne pas jouer</button><button class="opt" onclick="q(this,false)">Doigt 10</button><button class="opt" onclick="q(this,false)">Accord mineur</button></div><div id="fb" class="feedback"></div></div></div></section>`}
function q(b,ok){document.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.classList.add(ok?'good':'bad');fb.className='feedback show '+(ok?'ok':'ko');fb.innerHTML=ok?'✅ Exact. Tu peux lire le diagramme de base.':'❌ X veut dire : ne joue pas cette corde.'; if(ok){award(40);complete('read')}}
function lab(){labChord=rnd(chords);selected=[];stage.innerHTML=`<section class="card"><h2>2. Chord Lab — construis l’accord ${labChord.id}</h2><p>Clique les bonnes cases sur le mini-manche. Objectif : retrouver les frettes de l’accord.</p><div class="lesson"><div>${diagram(labChord)}</div><div><div class="fretboard"><p><b>Mini-manche :</b> colonnes = cases 0 à 3. Lignes = cordes E A D G B e.</p><div class="fb-grid">${full.map((s,si)=>[0,1,2,3].map(fr=>`<div class="cell" data-si="${si}" data-fr="${fr}" onclick="toggleCell(this)">${s}<br>${fr}</div>`).join('')).join('')}</div></div><div class="actions"><button class="btn primary" onclick="checkLab()">Valider mon placement</button><button class="btn soft" onclick="lab()">Nouvel accord</button></div><div id="labfb" class="feedback"></div></div></div></section>`}
function toggleCell(el){el.classList.toggle('sel')}function checkLab(){let cells=[...document.querySelectorAll('.cell')],ok=true;cells.forEach(c=>{let si=+c.dataset.si,fr=c.dataset.fr,need=labChord.d[si];let should=need!='x'&&need==fr;let sel=c.classList.contains('sel');if(should)c.classList.add('good');if(sel&&!should){c.classList.add('bad');ok=false}if(should&&!sel)ok=false});labfb.className='feedback show '+(ok?'ok':'ko');labfb.innerHTML=ok?'✅ Super. Placement validé.':'❌ Regarde les cases vertes : ce sont les positions attendues.';if(ok){award(60);complete('lab')}}
function coach(){stage.innerHTML=`<section class="card"><h2>3. Coach rythmique — joue en 4 temps</h2><p>Active les temps à gratter. Puis lance le métronome : l’objectif est de sentir une mesure simple.</p><div class="note info">Pattern conseillé : <b>Bas – Bas – Haut – Haut/Bas</b>. Ici, clique les temps 1, 2, 4 et 7.</div><div class="drum" id="beats">${[1,2,3,4,5,6,7,8].map(i=>`<button class="beat" onclick="this.classList.toggle('on')">${i}</button>`).join('')}</div><div class="actions"><button class="btn primary" onclick="runBeats()">▶ Lancer</button><button class="btn green" onclick="complete('coach');award(50)">Je valide le rythme</button></div></section>`}
function runBeats(){let bs=[...document.querySelectorAll('.beat')];let i=0;let t=setInterval(()=>{bs.forEach(b=>b.classList.remove('hit'));bs[i].classList.add('hit'); if(bs[i].classList.contains('on'))play('G',false); i++; if(i>=bs.length)clearInterval(t)},420)}
function memory(){let pairs=chords.slice(0,6).flatMap(c=>[{k:c.id,t:c.id},{k:c.id,t:c.name}]);memoryCards=sh(pairs);openCards=[];matched=0;stage.innerHTML=`<section class="card"><h2>4. Memory accords</h2><p>Associe le nom court et le nom français.</p><div class="quiz">${memoryCards.map((c,i)=>`<button class="opt" id="m${i}" onclick="flip(${i})">?</button>`).join('')}</div><div id="memfb" class="feedback"></div></section>`}
function flip(i){let b=$('m'+i);if(b.disabled||openCards.includes(i))return;b.textContent=memoryCards[i].t;openCards.push(i);if(openCards.length==2){let [a,c]=openCards;if(memoryCards[a].k==memoryCards[c].k){$('m'+a).classList.add('good');$('m'+c).classList.add('good');$('m'+a).disabled=$('m'+c).disabled=true;matched++;openCards=[];award(20); if(matched==6){memfb.className='feedback show ok';memfb.innerHTML='✅ Memory terminé.';complete('memory')}}else setTimeout(()=>{openCards.forEach(x=>$('m'+x).textContent='?');openCards=[]},650)}}
function ear(){earChord=rnd(chords);stage.innerHTML=`<section class="card"><h2>5. Oreille musicale</h2><p>Écoute l’accord mystère. Repère sa couleur : majeur = plus ouvert, mineur = plus sombre.</p><div class="scene" style="min-height:220px"><div><div class="guitar">🎧</div><button class="btn primary" onclick="play('${earChord.id}',false)">Écouter l’accord mystère</button></div></div><div class="quiz"><button class="opt" onclick="earAns(this,'majeur')">Majeur</button><button class="opt" onclick="earAns(this,'mineur')">Mineur</button><button class="opt" onclick="earAns(this,'C')">C uniquement</button><button class="opt" onclick="earAns(this,'D')">D uniquement</button></div><div id="earfb" class="feedback"></div></section>`}
function earAns(b,a){let ok=a==earChord.fam;document.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.classList.add(ok?'good':'bad');earfb.className='feedback show '+(ok?'ok':'ko');earfb.innerHTML=ok?`✅ Exact : ${earChord.id} est ${earChord.fam}.`:`❌ C’était ${earChord.id}, accord ${earChord.fam}.`;if(ok){award(60);complete('ear')}}
function song(){stage.innerHTML=`<section class="card"><h2>6. Mini-morceau : G – D – Em – C</h2><p>Cette progression est très courante. Écoute, puis avance accord par accord.</p><div class="actions"><button class="btn primary" onclick="songPlay()">▶ Jouer la progression</button><button class="btn green" onclick="complete('song');award(60)">Je sais suivre la progression</button></div><div id="songArea" class="two">${['G','D','Em','C'].map(id=>`<div>${diagram(chords.find(c=>c.id==id))}</div>`).join('')}</div></section>`}
function bossStart(){stage.innerHTML=`<section class="card"><h2>7. Boss final</h2><p>10 questions rapides : diagrammes, écoute, familles, cordes muettes.</p><button class="btn danger" onclick="startBoss()">🔥 Lancer le boss final</button></section>`}
function startBoss(){boss={i:0,score:0,qs:Array.from({length:10},makeQ)};bossQ()}function makeQ(){let c=rnd(chords),type=Math.floor(Math.random()*4);if(type==0)return{c,q:'Quel est cet accord ?',html:diagram(c),a:c.id,o:sh([c.id,...sh(chords.filter(x=>x.id!=c.id)).slice(0,3).map(x=>x.id)])};if(type==1)return{c,q:`${c.id} est...`,a:c.fam,o:sh(['majeur','mineur','diminué','suspendu'])};if(type==2){let mute=c.d.map((v,i)=>v=='x'?full[i]:null).filter(Boolean).join(' et ')||'Aucune';return{c,q:`Pour ${c.id}, quelle corde est muette ?`,a:mute,o:sh([mute,'G','B','Toutes'])}}return{c,q:'Écoute : quel accord ?',audio:true,a:c.id,o:sh([c.id,...sh(chords.filter(x=>x.id!=c.id)).slice(0,3).map(x=>x.id)])}}
function bossQ(){let q=boss.qs[boss.i];stage.innerHTML=`<section class="card"><span class="pill">Question ${boss.i+1}/10</span><h2>${q.q}</h2>${q.html||''}${q.audio?`<button class="btn primary" onclick="play('${q.c.id}',false)">🎧 écouter</button>`:''}<div class="quiz">${q.o.map((o,i)=>`<button class="opt" onclick="bossAns(this,'${String(o).replaceAll("'","&#39;")}')">${o}</button>`).join('')}</div><div id="bossfb" class="feedback"></div></section>`}
function bossAns(b,a){let q=boss.qs[boss.i],ok=a==q.a;document.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.classList.add(ok?'good':'bad');if(ok)boss.score++;bossfb.className='feedback show '+(ok?'ok':'ko');bossfb.innerHTML=(ok?'✅':'❌')+` Réponse : ${q.a} <div class="actions"><button class="btn primary" onclick="bossNext()">${boss.i==9?'Voir résultat':'Suivant'}</button></div>`}
function bossNext(){boss.i++; if(boss.i>=10)bossResult(); else bossQ()}function bossResult(){complete('boss');award(100);let s=boss.score;stage.innerHTML=`<section class="card"><h2>Résultat final</h2><div class="result">${s}/10</div><div class="note ${s>=7?'ok':'ko'}"><b>${s>=9?'Guitar Hero débutant':s>=7?'Accords solides':s>=5?'En progression':'À retravailler'}</b><br>${s>=7?'Tu peux maintenant travailler les transitions entre accords.':'Reprends le Chord Lab et l’oreille musicale, puis relance le boss.'}</div><div class="actions"><button class="btn primary" onclick="startBoss()">Refaire le boss</button><button class="btn soft" onclick="go('lab')">Retour au lab</button></div></section>`}
function freq(note){let m=note.match(/^([A-G]#?)(\d)$/),pc={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};let midi=12*(+m[2]+1)+pc[m[1]];return 440*Math.pow(2,(midi-69)/12)}
function play(id,slow){let c=chords.find(x=>x.id==id),AC=window.AudioContext||window.webkitAudioContext;if(!AC)return alert('Audio non supporté');let ctx=new AC(),now=ctx.currentTime,gap=slow?.16:.035;c.notes.forEach((n,i)=>{let o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();o.type='triangle';o.frequency.value=freq(n);f.type='lowpass';f.frequency.value=1800;g.gain.setValueAtTime(.0001,now+i*gap);g.gain.exponentialRampToValueAtTime(.13,now+.08+i*gap);g.gain.exponentialRampToValueAtTime(.0001,now+1.3+i*gap);o.connect(f);f.connect(g);g.connect(ctx.destination);o.start(now+i*gap);o.stop(now+1.45+i*gap)})}
function progression(){['C','G','Am','E'].forEach((id,i)=>setTimeout(()=>play(id,false),i*850))}function songPlay(){['G','D','Em','C'].forEach((id,i)=>setTimeout(()=>play(id,false),i*900))}
render();
</script></body></html>
